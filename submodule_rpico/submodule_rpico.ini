#------------------------- esp32 + rpico (RP2040 SWD) -------------------------
[env:esp32-rpico]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_program/module_prog/> +<module_program/submodule_rpico/> +<module_udp/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_UDP
	-D DEBUG_RPICO=1
	-D DEBUG_PROG=1
	-D SWDPIN_CLK=21
	-D SWDPIN_DATA=19
	-D RPICO_RST_PIN=22
	-D RPICO_SWD_DELAY=2
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = progRpico
define = PROGTYPE_RPICO
web = 1
loop = 0
